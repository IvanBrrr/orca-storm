name: Storca upstream transfer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch named main branches and create incremental bundle
        run: |
          git fetch --no-tags --unshallow origin main
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch --no-tags upstream main
          git bundle create upstream.bundle refs/remotes/upstream/main ^refs/remotes/origin/main
          git rev-parse refs/remotes/upstream/main
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-git-bundle
          path: upstream.bundle
          compression-level: 0
          retention-days: 1
